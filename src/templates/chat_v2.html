<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-чат</title>
    <link rel="stylesheet" type="text/css" href="/static/styles/chat.css">
</head>
<body>
    <div class="chat-container">
        <div class="items-list" id="itemsList">
            <h2 id="current-user">Пользователь</h2>
            <button id="create-group-button">Создать группу</button>
            <h3>
                <div class="favorite" data-user-id="{{ user.id }}">
                    Избранное
                </div>
            </h3>
            
            <div class="content">
                <form id="usersForm" class="form active">
                {% for chat in users_all %}
                    {% if chat.id != user.id %}
                        <div class="user-item" data-user-id="{{ chat.id }}">
                            {{ chat.name }}
                        </div>
                    {% endif %}
                {% endfor %}
                </form>
                <form id="groupsForm" class="form">
                {% for chat in groups_all %}
                    {% if chat.id != group.id %}
                        <div class="group-item" data-user-id="{{ chat.id }}">
                            {{ chat.name }}
                        </div>
                    {% endif %}
                {% endfor %}
                </form>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <span>Мини-чат</span>
                <button class="logout-button" id="logoutButton" onclick="logout()">Выход</button>
            </div>
            <div class="messages" id="messages">
                <div class="welcome-message">Выберите чат для общения</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." disabled>
                <button id="sendButton" disabled>Отправить</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Создать группу</h2>
            <input type="text" id="group-name" placeholder="Название группы">
            <input type="email" id="invite-email" placeholder="Email участника">
            <button id="add-member-btn">Добавить участника</button>
            <button id="create-group-confirm-btn">Создать</button>
            <ul id="group-members-list"></ul>
        </div>
    </div>

<script>
    const currentUserId = parseInt("{{ user.id }}", 10);
</script>

<script src="/static/js/chat.js"></script>
</body>
</html>
